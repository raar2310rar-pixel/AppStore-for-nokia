name: AshaStore

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Получаем исходники
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'


      # --------------------------------------------------
      # 3. Проверяем проект
      # --------------------------------------------------

      - name: Check project
        run: |
          echo "=== Project ==="

          find . -maxdepth 3 -type f -print

          echo ""

          if [ ! -f "AshaStore.java" ]; then
            echo "ERROR: AshaStore.java not found!"
            exit 1
          fi

          if [ ! -f "META-INF/MANIFEST.MF" ]; then
            echo "ERROR: META-INF/MANIFEST.MF not found!"
            exit 1
          fi

          echo "AshaStore.java: OK"
          echo "MANIFEST.MF: OK"


      # --------------------------------------------------
      # 4. Скачиваем Java ME API автоматически
      # --------------------------------------------------

      - name: Download Java ME APIs
        run: |
          mkdir -p tools/lib

          echo "Downloading CLDC 1.1 API..."

          wget -q \
            https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar \
            -O tools/lib/cldcapi11.jar

          echo "Downloading MIDP API..."

          wget -q \
            https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar \
            -O tools/lib/midpapi20.jar

          echo ""
          echo "Downloaded libraries:"

          ls -lh tools/lib/


      # --------------------------------------------------
      # 5. Проверяем API
      # --------------------------------------------------

      - name: Verify Java ME APIs
        run: |
          test -s tools/lib/cldcapi11.jar
          test -s tools/lib/midpapi20.jar

          echo "CLDC API OK"
          echo "MIDP API OK"


      # --------------------------------------------------
      # 6. Получаем preverify
      # --------------------------------------------------

      - name: Download preverify
        run: |
          mkdir -p tools/preverify

          echo "Downloading Java ME preverifier..."

          wget -q \
            https://github.com/SodalisRetro/j2me-tools/releases/download/v1.0/preverify-linux \
            -O tools/preverify/preverify

          chmod +x tools/preverify/preverify

          echo "Preverify:"
          tools/preverify/preverify -help || true


      # --------------------------------------------------
      # 7. Подготовка
      # --------------------------------------------------

      - name: Prepare build
        run: |
          rm -rf build

          mkdir -p build/tmpclasses
          mkdir -p build/classes

          rm -f AshaStore.jar
          rm -f AshaStore.jad


      # --------------------------------------------------
      # 8. Компиляция Java ME
      # --------------------------------------------------

      - name: Compile MIDlet
        run: |
          echo "=== Compiling AshaStore ==="

          javac \
            -source 1.6 \
            -target 1.6 \
            -bootclasspath \
            tools/lib/cldcapi11.jar:tools/lib/midpapi20.jar \
            -d build/tmpclasses \
            AshaStore.java

          echo ""
          echo "Compilation successful."


      # --------------------------------------------------
      # 9. Preverification
      # --------------------------------------------------

      - name: Preverify MIDlet
        run: |
          echo "=== Preverification ==="

          tools/preverify/preverify \
            -classpath \
            tools/lib/cldcapi11.jar:tools/lib/midpapi20.jar \
            -d build/classes \
            build/tmpclasses

          echo ""
          echo "Preverification successful."


      # --------------------------------------------------
      # 10. Создаём JAR
      # --------------------------------------------------

      - name: Build JAR
        run: |
          echo "=== Building AshaStore.jar ==="

          jar cvfm \
            AshaStore.jar \
            META-INF/MANIFEST.MF \
            -C build/classes .

          if [ ! -f "AshaStore.jar" ]; then
            echo "ERROR: JAR was not created!"
            exit 1
          fi

          echo ""
          echo "JAR created successfully:"
          ls -lh AshaStore.jar


      # --------------------------------------------------
      # 11. Создаём правильный JAD
      # --------------------------------------------------

      - name: Generate JAD
        run: |
          echo "=== Generating AshaStore.jad ==="

          JAR_SIZE=$(stat -c%s AshaStore.jar)

          cat > AshaStore.jad <<EOF
MIDlet-Name: AshaStore
MIDlet-Version: 1.2
MIDlet-Vendor: Custom
MIDlet-1: AshaStore,,AshaStore
MicroEdition-Configuration: CLDC-1.1
MicroEdition-Profile: MIDP-2.1
MIDlet-Jar-Size: ${JAR_SIZE}
MIDlet-Jar-URL: AshaStore.jar
EOF

          echo ""
          echo "=== AshaStore.jad ==="

          cat AshaStore.jad


      # --------------------------------------------------
      # 12. Проверка JAR
      # --------------------------------------------------

      - name: Verify JAR
        run: |
          echo "=== JAR contents ==="

          jar tf AshaStore.jar

          echo ""

          if ! jar tf AshaStore.jar | grep -q "^AshaStore.class$"; then
            echo "ERROR: AshaStore.class not found!"
            exit 1
          fi

          echo "AshaStore.class: OK"


      # --------------------------------------------------
      # 13. Проверка JAD
      # --------------------------------------------------

      - name: Verify JAD
        run: |
          grep "MIDlet-Name:" AshaStore.jad
          grep "MIDlet-Version:" AshaStore.jad
          grep "MIDlet-Vendor:" AshaStore.jad
          grep "MIDlet-Jar-Size:" AshaStore.jad
          grep "MIDlet-Jar-URL:" AshaStore.jad

          echo ""
          echo "JAD verification successful."


      # --------------------------------------------------
      # 14. Загружаем готовые файлы
      # --------------------------------------------------

      - name: Upload AshaStore package
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore-Package
          path: |
            AshaStore.jar
            AshaStore.jad
          if-no-files-found: error
