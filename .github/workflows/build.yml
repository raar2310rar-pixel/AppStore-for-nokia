name: AshaStore Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Check repository structure
        run: |
          echo "Checking root directory..."
          ls -la
          echo "Checking META-INF directory..."
          ls -la META-INF/ || echo "META-INF directory not found"

      - name: Download Wireless Toolkit / MIDP libraries
        run: |
          mkdir -p lib
          curl -L --fail https://repo1.maven.org/maven2/javax/microedition/lcdui/lcdui/1.0/lcdui-1.0.jar -o lib/midp.jar
          curl -L --fail https://repo1.maven.org/maven2/net/sf/kxml/kxml2/2.3.0/kxml2-2.3.0.jar -o lib/cldc.jar

      - name: Verify downloaded libraries
        run: |
          ls -la lib/
          file lib/cldc.jar
          file lib/midp.jar

      - name: Compile AshaStore.java
        run: |
          mkdir -p build/classes
          javac -source 1.6 -target 1.6 -cp "lib/cldc.jar:lib/midp.jar" -d build/classes AshaStore.java

      - name: Build JAR package
        run: |
          jar cvfm AshaStore.jar META-INF/MANIFEST.MF -C build/classes .

      - name: Verify JAR contents
        run: |
          jar tf AshaStore.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore-JAR
          path: AshaStore.jar
