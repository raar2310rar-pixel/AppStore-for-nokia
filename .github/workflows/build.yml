name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Дает права на создание релизов и загрузку файлов

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      # ... все остальные ваши шаги (Java, сборка, JAD) ...

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Asha Store v1.0.${{ github.run_number }}"
          files: |
            dist/AshaStore.jar
            dist/AshaStore.jad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
