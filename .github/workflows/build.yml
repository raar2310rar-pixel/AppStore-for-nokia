name: AshaStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Wireless Toolkit / MIDP libraries
        run: |
          mkdir -p lib
          curl -L https://github.com/microemu/microemu/raw/master/microemu-midp/src/main/resources/org/microemu/cldc-1.1.jar -o lib/cldc.jar
          curl -L https://github.com/microemu/microemu/raw/master/microemu-midp/src/main/resources/org/microemu/midp-2.0.jar -o lib/midp.jar

      - name: Compile AshaStore.java
        run: |
          mkdir -p build/classes
          javac -source 1.6 -target 1.6 -cp "lib/cldc.jar:lib/midp.jar" -d build/classes AshaStore.java

      - name: Build JAR package
        run: |
          jar cvfm AshaStore.jar META-INF/MANIFEST.MF -C build/classes .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore-JAR
          path: AshaStore.jar
