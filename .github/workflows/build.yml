name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить системные зависимости и 32-бит библиотеки
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential ant zip unzip libc6:i386 libstdc++6:i386

      - name: Установить Java 8 (для J2ME / Asha 501)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Скачать J2ME DevKit
        run: |
          git clone https://github.com/retro-systems-lab/j2me-devkit.git devkit

      - name: Установить инструменты J2ME
        working-directory: devkit
        run: |
          make setup || true

      - name: Положить исходник
        run: |
          mkdir -p devkit/src
          if [ -f AshaStore.java ]; then
            cp AshaStore.java devkit/src/AshaStore.java
          else
            echo "Файл AshaStore.java не найден в корне репозитория!"
            find . -maxdepth 2 -name "*.java"
          fi

      - name: Настроить JAD
        working-directory: devkit
        run: |
          [ -f app.jad ] || touch app.jad
          sed -i 's/^MIDlet-Name:.*/MIDlet-Name: Asha Store/' app.jad || true
          sed -i 's/^MIDlet-Vendor:.*/MIDlet-Vendor: Asha Store/' app.jad || true
          sed -i 's/^MIDlet-1:.*/MIDlet-1: Asha Store,,AshaStore/' app.jad || true

      - name: Собрать JAR
        working-directory: devkit
        run: |
          make build

      - name: Подготовить результат
        run: |
          mkdir -p result
          find devkit -name "*.jar" -exec cp {} result/AshaStore.jar \;

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: result/AshaStore.jar
