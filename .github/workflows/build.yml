name: AshaStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 environment
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Fix line endings in MANIFEST.MF
        run: |
          sudo apt-get install -y dos2unix
          dos2unix META-INF/MANIFEST.MF

      - name: Verify Manifest file existence and content
        run: |
          if [ -f "META-INF/MANIFEST.MF" ]; then
            echo "=== MANIFEST.MF Content ==="
            cat META-INF/MANIFEST.MF
            echo ""
          else
            echo "Error: MANIFEST.MF not found!"
            exit 1
          fi

      - name: Prepare local build environment and download J2ME API
        run: |
          mkdir -p build/classes
          wget https://repo1.maven.org/maven2/org/microemu/microemulator/2.0.4/microemulator-2.0.4.jar -O j2me-api.jar

      - name: Compile AshaStore.java source code
        run: |
          javac -source 1.4 -target 1.4 -cp j2me-api.jar -d build/classes AshaStore.java

      - name: Build final JAR package
        run: |
          jar cvfm AshaStore.jar META-INF/MANIFEST.MF -C build/classes .

      - name: Generate correct JAD descriptor
        run: |
          JAR_SIZE=$(stat -c%s AshaStore.jar)
          cp META-INF/MANIFEST.MF AshaStore.jad
          echo "MIDlet-Jar-Size: $JAR_SIZE" >> AshaStore.jad
          echo "MIDlet-Jar-URL: AshaStore.jar" >> AshaStore.jad
          # Гарантируем пустую строку в конце файла для Asha OS
          echo "" >> AshaStore.jad
          dos2unix AshaStore.jad

      - name: Upload built artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore-Package
          path: |
            AshaStore.jar
            AshaStore.jad
