name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Скачать валидный J2ME API (MIDP 2.0 / CLDC 1.1)
        run: |
          mkdir -p lib
          # Используем прямой надежный источник cldc/midp stubs из Maven Central
          curl -fL "https://repo1.maven.org/maven2/org/microedition/midpapi20/2.0/midpapi20-2.0.jar" -o lib/midpapi20.jar
          
          # Проверяем, что скачанный файл действительно является ZIP/JAR архивом
          unzip -t lib/midpapi20.jar || (echo "Скачанный файл поврежден!" && exit 1)

      - name: Подготовить структуру директорий
        run: |
          mkdir -p bin dist src
          # Копируем AshaStore.java в папку src/
          find . -maxdepth 2 -name "AshaStore.java" -exec cp {} src/ \;

      - name: Очистка файла кода от артефактов
        run: |
          sed -i 's/```java//gI' src/*.java
          sed -i 's/```//g' src/*.java
          sed -i 's/`//g' src/*.java
          sed -i 's/\xA0/ /g' src/*.java
          sed -i '/^[[:space:]]*java[[:space:]]*$/d' src/*.java

      - name: Компиляция Java (MIDP 2.1)
        run: |
          javac -source 1.7 -target 1.7 -cp lib/midpapi20.jar -d bin src/*.java

      - name: Создание манифеста
        run: |
          mkdir -p bin/META-INF
          {
            echo "Manifest-Version: 1.0"
            echo "MIDlet-1: Asha Store,,AshaStore"
            echo "MIDlet-Name: Asha Store"
            echo "MIDlet-Vendor: Asha Store"
            echo "MIDlet-Version: 1.0.0"
            echo "MicroEdition-Configuration: CLDC-1.1"
            echo "MicroEdition-Profile: MIDP-2.1"
          } > bin/META-INF/MANIFEST.MF

      - name: Упаковка в JAR
        run: |
          jar cfm dist/AshaStore.jar bin/META-INF/MANIFEST.MF -C bin .

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: dist/AshaStore.jar
