```yaml
name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Скачать J2ME DevKit
        run: |
          git clone https://github.com/retro-systems-lab/j2me-devkit.git devkit

      - name: Установить инструменты J2ME
        working-directory: devkit
        run: |
          make setup

      - name: Положить исходник
        run: |
          mkdir -p devkit/src
          cp AshaStore.java devkit/src/AshaStore.java

      - name: Настроить JAD
        working-directory: devkit
        run: |
          sed -i 's/^MIDlet-Name:.*/MIDlet-Name: Asha Store/' app.jad
          sed -i 's/^MIDlet-Vendor:.*/MIDlet-Vendor: Asha Store/' app.jad
          sed -i 's/^MIDlet-1:.*/MIDlet-1: Asha Store,,AshaStore/' app.jad

      - name: Собрать JAR
        working-directory: devkit
        run: |
          make build

      - name: Подготовить результат
        run: |
          mkdir -p result
          cp devkit/dist/app.jar result/AshaStore.jar

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: result/AshaStore.jar
```
