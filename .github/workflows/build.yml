name: Build AshaStore J2ME Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download J2ME Stub Libraries
        run: |
          mkdir -p lib
          wget -q -O lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          wget -q -O lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar

      - name: Create Build Directories
        run: |
          mkdir -p build/classes
          mkdir -p dist

      - name: Compile Java Code
        run: |
          javac -source 1.3 -target 1.1 -bootclasspath lib/cldcapi11.jar:lib/midpapi20.jar -d build/classes src/AshaStore.java

      - name: Create Manifest
        run: |
          mkdir -p build/classes/META-INF
          cat << 'EOF' > build/classes/META-INF/MANIFEST.MF
          MIDlet-1: Asha Store, , AshaStore
          MIDlet-Name: Asha Store
          MIDlet-Vendor: Custom
          MIDlet-Version: 1.2.0
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.1

          EOF

      - name: Package JAR File
        run: |
          jar cvfm dist/AshaStore.jar build/classes/META-INF/MANIFEST.MF -C build/classes .

      - name: Generate JAD File
        run: |
          JAR_SIZE=$(stat -c%s "dist/AshaStore.jar")
          cat << EOF > dist/AshaStore.jad
          MIDlet-1: Asha Store, , AshaStore
          MIDlet-Name: Asha Store
          MIDlet-Vendor: Custom
          MIDlet-Version: 1.2.0
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.1
          MIDlet-Jar-URL: AshaStore.jar
          MIDlet-Jar-Size: $JAR_SIZE
          EOF

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore-J2ME-Build
          path: |
            dist/AshaStore.jar
            dist/AshaStore.jad
