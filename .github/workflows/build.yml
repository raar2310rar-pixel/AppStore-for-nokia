name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Скачать J2ME (MIDP/CLDC) библиотеку
        run: |
          mkdir -p lib
          curl -sL "https://github.com/microedition/midp-api/raw/master/midpapi21.jar" -o lib/midpapi21.jar

      - name: Подготовить папки
        run: |
          mkdir -p bin dist
          rm -rf src
          mkdir -p src
          find . -maxdepth 2 -name "AshaStore.java" -exec cp {} src/ \;

      - name: Глубокая очистка Java-кода
        run: |
          sed -i 's/```java//gI' src/*.java
          sed -i 's/```//g' src/*.java
          sed -i 's/`//g' src/*.java
          sed -i 's/\xA0/ /g' src/*.java
          sed -i '/^[[:space:]]*java[[:space:]]*$/d' src/*.java

      - name: Компиляция Java (с MIDP 2.1 API)
        run: |
          javac -source 1.7 -target 1.7 -bootclasspath lib/midpapi21.jar -d bin src/*.java

      - name: Создание манифеста
        run: |
          mkdir -p bin/META-INF
          {
            echo "Manifest-Version: 1.0"
            echo "MIDlet-1: Asha Store,,AshaStore"
            echo "MIDlet-Name: Asha Store"
            echo "MIDlet-Vendor: Asha Store"
            echo "MIDlet-Version: 1.0.0"
            echo "MicroEdition-Configuration: CLDC-1.1"
            echo "MicroEdition-Profile: MIDP-2.1"
          } > bin/META-INF/MANIFEST.MF

      - name: Упаковка в JAR
        run: |
          jar cfm dist/AshaStore.jar bin/META-INF/MANIFEST.MF -C bin .

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: dist/AshaStore.jar
