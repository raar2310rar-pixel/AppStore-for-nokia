name: Build AshaStore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Установить Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget

      - name: Показать структуру файлов (для отладки)
        run: |
          echo "=== Поиск java-файлов ==="
          find . -name "*.java"

      - name: Подготовить структуру проекта
        run: |
          mkdir -p src bin dist
          find . -maxdepth 2 -name "*.java" -exec cp {} src/ \;

      - name: Скомпилировать Java ME (MIDP 2.1)
        run: |
          javac -source 1.3 -target 1.3 -bootclasspath /usr/lib/jvm/java-8-temurin/jre/lib/rt.jar -d bin src/*.java || \
          javac -source 1.7 -target 1.7 -d bin src/*.java

      - name: Создать MANIFEST.MF
        run: |
          mkdir -p bin/META-INF
          echo "Manifest-Version: 1.0" > bin/META-INF/MANIFEST.MF
          echo "MIDlet-1: AshaStore,, AshaStore" >> bin/META-INF/MANIFEST.MF
          echo "MIDlet-Name: Asha Store" >> bin/META-INF/MANIFEST.MF
          echo "MIDlet-Vendor: AshaStore" >> bin/META-INF/MANIFEST.MF
          echo "MIDlet-Version: 1.0.0" >> bin/META-INF/MANIFEST.MF
          echo "MicroEdition-Configuration: CLDC-1.1" >> bin/META-INF/MANIFEST.MF
          echo "MicroEdition-Profile: MIDP-2.1" >> bin/META-INF/MANIFEST.MF

      - name: Запаковать JAR
        run: |
          jar cfm dist/AshaStore.jar bin/META-INF/MANIFEST.MF -C bin .

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: dist/AshaStore.jar
