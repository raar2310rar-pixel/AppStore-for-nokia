name: Build AshaStore

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Скачать J2ME DevKit
        run: |
          git clone https://github.com/retro-systems-lab/j2me-devkit.git devkit

      - name: Установить инструменты J2ME
        working-directory: devkit
        run: |
          make setup

      - name: Положить AshaStore.java в проект
        run: |
          cp AshaStore.java devkit/src/AshaStore.java

      - name: Настроить MIDlet
        working-directory: devkit
        run: |
          sed -i 's/MIDlet-Name: Demo/MIDlet-Name: Asha Store/' app.jad
          sed -i 's/MIDlet-Vendor: Example/MIDlet-Vendor: Asha Store/' app.jad
          sed -i 's/MIDlet-1: Demo,,MainMIDlet/MIDlet-1: Asha Store,,AshaStore/' app.jad

      - name: Собрать JAR
        working-directory: devkit
        run: |
          make build

      - name: Переименовать JAR
        run: |
          mkdir -p result
          cp devkit/dist/app.jar result/AshaStore.jar

      - name: Загрузить AshaStore.jar
        uses: actions/upload-artifact@v4
        with:
          name: AshaStore
          path: result/AshaStore.jar
